[project]
name = "alignli-backend"
version = "0.1.0"
description = "Alignli AI Hiring Copilot - Backend API"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy[asyncio]==2.0.36",
    "alembic==1.14.0",
    "pydantic==2.10.3",
    "pydantic-settings==2.7.0",
    "httpx==0.28.1",
    "asyncpg==0.30.0",
    "python-multipart==0.0.19",
    "stripe==7.12.0",
    "anthropic==0.21.3",
    "resend==2.4.0",
    "PyJWT[crypto]==2.9.0",
    "inngest==0.4.8",
    "svix==1.41.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "hypothesis==6.119.3",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "coverage==7.6.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.9"
strict = true
